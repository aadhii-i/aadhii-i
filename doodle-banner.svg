    <path d="M480 90 L560 90"/>
    <path d="M560 90 L560 60 L620 60"/>
    <path d="M480 150 L560 150"/>
    <path d="M560 150 L560 210 L640 210"/>
    <path d="M320 210 L400 210 L400 240"/>
    <path d="M480 240 L560 240"/>
    <path d="M700 150 L760 150"/>
    <path d="M700 210 L760 210 L760 240"/>
    <path d="M120 150 L120 210 L200 210"/>
