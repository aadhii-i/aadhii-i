    <circle cx="480" cy="90" r="3"/>
    <circle cx="480" cy="150" r="3"/>
    <circle cx="480" cy="240" r="3"/>
    <circle cx="700" cy="150" r="3"/>
    <circle cx="700" cy="210" r="3"/>
    <circle cx="160" cy="90" r="3"/>
    <circle cx="120" cy="150" r="3"/>
